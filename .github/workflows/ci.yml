name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (via rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install bubblewrap (sandbox)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Lint (clippy)
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --release

      - name: Conformity tests (300 missions)
        run: cargo test --release

      - name: Build distribution archive (gameshell.sh)
        run: bash make-archive.sh

      - name: Full engine test suite (55 tests)
        run: ./tests/run_tests.sh
