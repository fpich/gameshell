[package]
name = "gameshell"
version = "2.0.0"
edition = "2021"
description = "GameShell — RPG éducatif pour apprendre le shell Debian 13 (BTS SIO SISR), 3 campagnes, 300 missions, bac à sable isolé"
authors = ["Équipe GameShell"]
license = "Proprietary"
repository = "https://github.com/fpich/gameshell"
keywords = ["education", "shell", "linux", "debian", "rpg", "learning"]
categories = ["education"]

[dependencies]
colored = "2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.4", features = ["derive"] }

[[bin]]
name = "gameshell"
path = "src/main.rs"
